[Proxies]
# This property is used by the clients to connect to IceStorm.
TopicManager = "IceStorm/TopicManager:default -p 9999"

# Proxies for publishes interfaces
CameraRGBDSimplePubPrefix = ""
FullPoseEstimationPubPrefix = "zed"
IMUPubPrefix = ""

# Proxies for required interfaces
CameraRGBDSimple = "camerargbdsimple:tcp -h localhost -p 10009"


[Endpoints]
# Endpoints for implements interfaces
CameraRGBDSimple = "tcp -p 11000"
Lidar3D = "tcp -p 11001"
MediaPlaneDDS = "tcp -p 11002"

[Config]
Simulated = false
Display = true
Publish = false
# ZED SDK depth engine (sl::DEPTH_MODE). From lightest/fastest to heaviest/most accurate:
#   PERFORMANCE  - deprecated classical stereo matching, optimized for speed
#   QUALITY      - deprecated classical stereo matching, better on low-texture surfaces
#   ULTRA        - deprecated classical stereo matching, favors edges/sharpness, more GPU memory
#   NEURAL_LIGHT - neural disparity estimation, lightest neural option (needs AI module)
#   NEURAL       - neural disparity estimation, balanced accuracy/cost (needs AI module)
#   NEURAL_PLUS  - neural disparity estimation, most accurate, heaviest GPU/CPU cost (needs AI module)
DepthMode = "NEURAL_PLUS"
Extrinsic = [0,0,0,0,0,0]
# Publish RGB+depth on the zero-copy DDS media plane (CORTEX). Off by default.
PublishDDS = false

# DDS media plane (only used when Config.PublishDDS = true). Camera metadata is
# advertised into DSR by the robot_concept agent, not here.
[DDS]
Domain = 7
RGBTopic = "rc/zed/rgb"
DepthTopic = "rc/zed/depth"
RGBFormat = "rgb"        # "rgb" (real ZED) or "bgr" (e.g. Webots source)
# QoS — carried in the descriptor relayed to DSR; consumers must agree.
HistoryDepth = 8
SharedMemoryOnly = true
DataSharing = false      # OFF = churn-safe in CORTEX (see media_transport.h)

[Period]
Compute = 20
Emergency = 500

[Component.Debug]
Verbose = true

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"
