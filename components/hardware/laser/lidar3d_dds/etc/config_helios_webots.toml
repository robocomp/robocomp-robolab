# lidar3d_dds — Helios / Webots (TOML form of config_helios_webots)

### Lidar params (flat keys) ###
# RSHELIOS=0   RSBPEARL=1
lidar_model = 0
dest_pc_ip_addr = "192.168.50.210"
msop_port = 6699
difop_port = 7788
simulator = true

# DDS publish gate + robot-body self-filter dilate (flat keys)
PublishDDS = true
Dilate = 0.05

# Static mount (single source of geometry): read the body<-helios transform from the DSR shadow.json.
# The self-filter and consumer placement now share this ONE value (~1.03 m) — the mesh is accurate
# (SolidWorks / printed robot), so no decouple is needed. If shadow.json can't be read, roll back to
# the rx..tz fallback below (kept in sync at tz=1030).
mount_file = "/home/robolab/robocomp/components/active_inference/robot_concept/shadow.json"
mount_key  = "helios"
rx = -0.0
# 2026-08-29: 0 -> pi. The helios is now mounted UPSIDE DOWN (wide part of the fan pointing UP, at
# the walls) — Shadow.proto `rotation 1 1 0 3.14159`, shadow.json body<-helios
# euler_xyz (0, pi, 0). This fallback is the SILENT path: if shadow.json cannot be read the driver
# logs to stderr and carries on with these numbers, so leaving ry at 0 here would hand the mesh
# self-filter an UPRIGHT sensor while the cloud arrives inverted — every self-return tested against
# the wrong half of the robot. The 45 mm tz staleness below is the same failure mode, one axis over.
ry = 3.14159265359   # fallback only; MUST equal shadow.json body<-helios euler_y
rz = 0.0
tx = 0.0
ty = -155.0
tz = 1030.0        # fallback only (matches shadow.json body<-helios ~1.03 m)

[Proxies]
# Proxies for required interfaces
Lidar3D = "lidar3d:tcp -h localhost -p 11988"

[Endpoints]
# Endpoints for implements interfaces
Lidar3D = "tcp -p 11990"
MediaPlaneDDS = "tcp -p 11890"

# Robot-body self-filter (Embree). Removes lidar points hitting the static robot mesh.
[MeshFilter]
enabled = true

[Robot]
name = "Shadow"

# Floor/ceiling scene cut DISABLED — the floor/ceiling are informative (startup LiDAR
# calibration, ground plane) and are now filtered per-consumer, not at the source. Only
# the self-filter (footprint/skirt/mesh) stays here. Restore z=110 / z=2100 to re-enable.
[Floor]
z = -100000.0

[Top]
z = 100000.0

# Robot-frame footprint disc. The STL models only the ±0.24 m central column, so returns
# off the wider base/wheels/arm/protrusions survive the 5 cm mesh query. Drop everything
# inside this disc (radius in metres) within the z-band (mm). Safe: nothing inside the
# robot's own footprint is a real obstacle. radius = 0 disables.
[Footprint]
radius = 0.55
z_min = 110.0
z_max = 1350.0

# Wider near-floor skirt: a second disc confined to a low z-band. Catches near-floor
# self / ground-reflection returns that sit past the body footprint (e.g. the rear-base
# stray ~0.7 m out) WITHOUT hiding upright obstacles — their returns above z_max stay.
[Skirt]
radius = 0.75
z_min = 110.0
z_max = 600.0

# DDS lidar media plane (zero-copy LidarFrame). Metadata is advertised into DSR by
# the robot_concept agent, not here.
[DDS]
Domain = 7
Topic = "rc/lidar3d/points"
HistoryDepth = 8
SharedMemoryOnly = true
DataSharing = false

[Period]
Compute = 50
Emergency = 500

[Component.Debug]
Verbose = true

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

# ---------------------------------------------------------------------------------------------
# SENSOR MODEL advertised with the media plane
# ---------------------------------------------------------------------------------------------
# SENSOR MODEL advertised with the media plane
# ---------------------------------------------------------------------------------------------
# Beam geometry + range noise, emitted in the MediaDescriptor JSON that robot_concept relays
# verbatim onto the `helios` DSR node, so consumers stop re-asserting them as their own constants.
#
# ★ MIXED PROVENANCE, AND `Source` CANNOT SAY SO. One string labels the whole block, but the
#   geometry below is the SIMULATOR's (it must describe the data that actually arrives) while the
#   noise is the REAL RS-Helios-5515's datasheet figure. "simulated" is the CONSERVATIVE label:
#   it understates how well the noise is known instead of overstating it, and a consumer that
#   discounts a simulated source is wrong in the safe direction. `Ref` names both origins. If the
#   schema ever grows a per-field provenance, split them there rather than relabelling this.
# ★ Delete this section to advertise nothing. Absent means UNKNOWN = "consumer keeps its own
#   constant", never zero. Absent is always safe; a wrong number is not.
# ★ Extrinsics are NOT here (RT tree + mount_file above). Frame only NAMES the frame.
[SensorModel]
Version = 1
Source = "simulated"
Ref = "geometry: webots-shadow/protos/Shadow.proto Lidar 'helios' (worlds/piso/piso.wbt) | noise: RoboSense RS-Helios-5515 User Manual 3.0.1 (2022-06-29) sec 5.1.1"
Frame = "helios"

# ── Geometry: WHAT THE SIMULATOR EMITS ──────────────────────────────────────────────
# These are the sim's numbers, and they now agree with the device because the SIM was fixed, not
# because the config was bent to match a datasheet.
#
# ★★★2026-08-29, the whole episode in three steps, because the middle one is the lesson:
#   1. This block was first filled in with Rings = 32 / -54.5..+15.5 — P3Bot.proto's numbers. But
#      this config serves SHADOW, and the running world (worlds/piso/piso.wbt) builds a Shadow,
#      whose helios read `numberOfLayers 82, verticalFieldOfView 3.14159, tiltAngle -0.`: 82 layers
#      over 180 deg. The first thing this channel ever published was a 2.5x error in the vertical
#      span of the live stream.
#   2. It was briefly set to 82 / -90..+90 — correct about the data, and correct is not the same as
#      right. It described a sensor that can see STRAIGHT DOWN, which no RS-Helios can.
#   3. Shadow.proto was then given the fix P3Bot.proto took on 2026-08-27
#      (82/180 -> 32/70, tiltAngle 0 -> -0.34). The sim is now an H32F70 and these fields say so.
# ⚠ The channel is only as true as the file it is copied from. If either proto moves, this block
# moves in the same commit — that coupling is the entire point of publishing geometry from the
# driver instead of letting each consumer keep its own constant.
# ★2026-08-29 (2nd pass): the sim no longer DECLARES the H32F70 span, it GENERATES it. tiltAngle
# turned out to rotate the sweep in AZIMUTH (measured: 19.5 deg against the bpearl, matching the
# declared -0.34 rad), not to tilt the fan, so it is now 0 and the proto emits a symmetric 110 deg
# fan with 50 layers; the bridge publishes only the 32 inside [-55, +15]. These fields describe
# what actually arrives on the plane.
Rings = 32                 # of the 50 layers the sim generates; the bridge drops the other 18
AzimuthStepDeg = 0.4       # fieldOfView 6.28 rad over horizontalResolution 900
RateHz = 20.0              # defaultFrequency
FovStartDeg = -55.0        # 110 deg over 50 layers = 2.2449 deg/layer, windowed to [-55, +15]
FovEndDeg = 14.6           # the topmost surviving channel; the real unit's is +15
# ⚠ THAT SPAN IS IN THE SENSOR FRAME (`Frame = "helios"`), AND THE SENSOR HANGS UPSIDE DOWN.
# Read literally it says the fan points DOWN; in the BODY frame it points UP (+54.5..-15.5), because
# the body<-helios RT edge carries a 180 deg flip (shadow.json euler_xyz (0, pi, 0), 2026-08-29).
# This is the schema working as intended — "frame only NAMES the frame these intrinsics are expressed
# in; it never restates the pose" (media_transport.h) — but it is a live trap for a consumer that
# reads fov_start/end and skips the RT lookup. Apply the RT edge or you will conclude this sensor
# stares at the floor.
RangeMaxM = 100.0          # maxRange
#
# ⚠ RangeMinM deliberately UNSET. The DEVICE has a 0.2 m blind distance (manual sec 5.1.1); the
# SIM has none, and this stream is the sim. Publishing 0.2 m would have consumers throw away near
# returns that genuinely exist in the data.
#
# ⚠ RingElevDeg still UNSET, and the reason has narrowed to exactly two questions.
# The real H32F70's per-channel table IS published (manual Table 5) and it is strongly NON-UNIFORM:
# 2 deg per layer from +15 to +7, 1.5 from +7 to +4, 1.33 from +4 to -8, 2 from -8 to -10, and 3 deg
# from -10 all the way to -55. The channels are not even in elevation order (ch18 = -16 sits between
# ch17 = -10 and ch19 = -13). Webots spreads its 32 layers UNIFORMLY across the 70 deg span, so the
# manufacturer table does not describe this stream even now that the span and the count match.
# And the uniform list itself is ambiguous: 70/31 = 2.258 deg per layer if the endpoints are beams,
# 70/32 = 2.188 if they are not. residual_concept's HeliosBeamSpacingRad 0.0394 rad = 2.258 deg is
# the first of those — right, if Webots counts gaps the way the constant assumes.
# Two guesses is one too many to publish. Read the layer elevations off one sweep and set them.

# ── Noise: range channel ─────────────────────────────────────────────────────────────────────
# RS-Helios-5515 User Manual 3.0.1 sec 5.1.1, verbatim: "Ranging Accuracy (Typical) ±2cm", with
# the footnote "the ranging accuracy takes a 50% NIST diffuse reflector as the target. The test
# results may be affected by environment conditions, including but not limited to factors such as
# ambient temperature and target distance. The accuracy value is applicable to most channels, and
# there may exists differences between some channels."
#
# ★ READ AS 1 SIGMA, NOT AS A ±BOUND, AND THAT CHOICE IS DELIBERATE. The manual does not say which
#   it means. Reading ±2 cm as a 3-sigma bound would give 0.7 cm and make every downstream weight
#   ~3x overconfident; reading it as 1 sigma cannot silently sharpen a belief. When a datasheet is
#   ambiguous, take the reading that cannot over-trust.
# ★ WHY A DATASHEET NUMBER ON A SIMULATED STREAM. Webots documents `noise 0.005` as a fraction of
#   maxRange, and maxRange here is 100 => sigma = 0.5 m. The data REFUTES that: room_concept fits
#   walls to centimetres on this very stream, which a 0.5 m range sigma cannot produce. So the
#   simulator's own stated figure is unusable and the device's is the best available. It remains a
#   STAND-IN for a measurement, not a measurement.
# ★ HOW TO RETIRE THIS LINE: residuals of returns against a fitted wall plane give the floor
#   directly. Measure it, put the number here, and set Source = "measured".
RangeSigmaFloorM = 0.02
#
# ⚠ RangeKRel / RangeKIncidence deliberately UNSET. The datasheet quotes ONE flat typical accuracy
# with no range-proportional term, so there is no coefficient to publish — and 0.0 is not the same
# as absent: it would assert "this sensor does not degrade with range", a claim the manual never
# makes. Absent = unknown, and a consumer keeps whatever it already used.
